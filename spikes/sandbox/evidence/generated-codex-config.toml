# generated by spikes/sandbox/gen_host_config.py from the moat default policy
default_permissions = "moat"
approval_policy = "on-request"

[permissions.moat]
extends = ":workspace"   # project roots + temp writable, reads elsewhere

[permissions.moat.filesystem]
"~/.ssh/**" = "deny"
"~/.aws/**" = "deny"
"~/.gnupg/**" = "deny"
"~/.config/gh/**" = "deny"
"~/.netrc" = "deny"
"~/.docker/config.json" = "deny"
"~/.kube/**" = "deny"
"~/.config/gcloud/**" = "deny"
"~/.azure/**" = "deny"
"~/.git-credentials" = "deny"
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.cargo/credentials" = "deny"
"~/.cargo/credentials.toml" = "deny"
"~/.zsh_history" = "deny"
"~/.bash_history" = "deny"
"$SPIKE/.work/project/**/.env" = "deny"
"$SPIKE/.work/project/**/.env.*" = "deny"
"$SPIKE/.work/project/**/.envrc" = "deny"
"~/Library/Keychains/**" = "deny"
"~/.moat" = "read"
"~/.claude/settings.json" = "read"
"~/.claude/settings.local.json" = "read"
"~/.codex" = "read"
"~/.cursor/hooks.json" = "read"
"$SPIKE/.work/project/.claude/settings.json" = "read"
"$SPIKE/.work/project/.claude/settings.local.json" = "read"
"$SPIKE/.work/project/.cursor/hooks.json" = "read"
"$SPIKE/.work/project/.codex/hooks.json" = "read"
"$SPIKE/.work/project/.moat" = "read"
"$SPIKE/.work/project/bin/moat" = "read"
"$SPIKE/.work/project/bin/moat.exe" = "read"
"~/.zshrc" = "read"
"~/.bashrc" = "read"
"~/.bash_profile" = "read"
"~/.profile" = "read"
"~/.zprofile" = "read"
"~/.zshenv" = "read"

[permissions.moat.network]
enabled = true          # direct network stays blocked; the Codex proxy filters by domain

[permissions.moat.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"
"registry.npmjs.org" = "allow"
"crates.io" = "allow"
"static.crates.io" = "allow"
"index.crates.io" = "allow"
"proxy.golang.org" = "allow"
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"fd00:ec2::254" = "deny"
"100.100.100.200" = "deny"
"metadata.google.internal" = "deny"
"metadata.goog" = "deny"

[features]
network_proxy = true
