[package]
name = "openmoat-audit"
description = "Append-only local audit log for OpenMoat decisions (SQLite, WAL, redacted)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
openmoat-core.workspace = true
rusqlite.workspace = true
regex.workspace = true
serde.workspace = true
# `raw_value` embeds stored JSON cells in an export byte for byte (export.rs).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true

[features]
# Helpers for other crates' tests that need to tamper with a stored event.
test-support = []

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
