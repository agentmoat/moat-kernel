# agentmoat default policy, schema v1 (DESIGN.md §6.1).
# Evaluation: deny → allow → ask → defaults. Strictest verdict wins across the
# atomic actions of one tool call. `${project}` is the trusted project root.
# Deny rules are absolute (allow can never override them), so deny-by-default
# for a whole kind is expressed via `defaults`, with allow rules as the holes.
version: 1
defaults:
  "*": ask
  net: deny          # outbound network: only hosts listed under allow

deny:
  - id: secrets-paths
    reason: secret material
    fs.read: &secret-paths
      - "~/.ssh/**"
      - "~/.aws/**"
      - "~/.gnupg/**"
      - "~/.config/gh/**"
      - "~/.netrc"
      - "~/.docker/config.json"
      - "~/.kube/**"
      - "~/.config/gcloud/**"
      - "~/.azure/**"
      # package-registry and git credential stores
      - "~/.git-credentials"
      - "~/.npmrc"
      - "~/.pypirc"
      - "~/.cargo/credentials"
      - "~/.cargo/credentials.toml"
      # shell history holds pasted tokens and passwords
      - "~/.zsh_history"
      - "~/.bash_history"
      - "**/.env"
      - "**/.env.*"
      - "**/.envrc"
      # committed templates of .env carry no values
      - "!**/.env.example"
      - "!**/.env.sample"
      - "!**/.env.template"
      - "~/Library/Keychains/**"
    fs.write: *secret-paths
  - id: env-secrets
    reason: secret environment variable
    env.read: ["*_KEY", "*_TOKEN", "*_SECRET", "*_PASSWORD", "AWS_*", "GITHUB_TOKEN", "NPM_TOKEN"]
  - id: env-dump
    reason: prints every environment variable, secrets included
    shell:
      - "env $"
      - "env -0 $"
      - "env --null $"
      - "*/env $"
      - "printenv $"
      - "printenv -0 $"
      - "printenv --null $"
      - "*/printenv $"
      - "set $"
      - "export $"
      - "export -p $"
      - "declare $"
      - "declare -p $"
      - "declare -x $"
      - "typeset $"
      - "typeset -p $"
      - "typeset -x $"
  - id: env-poison
    reason: changes how later commands resolve or load code
    env.set: ["PATH", "LD_PRELOAD", "LD_LIBRARY_PATH", "DYLD_*", "NODE_OPTIONS", "PYTHONPATH", "GIT_*", "BASH_ENV", "ENV", "PROMPT_COMMAND", "MOAT_*"]
  - id: pipe-to-shell
    reason: executes remote or decoded content
    shell:
      - "curl * | {sh,bash,zsh,dash,ksh,fish}"
      - "curl * | {python*,node,perl,ruby,php,deno,bun,pwsh}"
      - "wget * | {sh,bash,zsh,dash,ksh,fish}"
      - "wget * | {python*,node,perl,ruby,php,deno,bun,pwsh}"
      # decoder stages are reported as a canonical `<decoder> -d | <interpreter>` pipeline
      - "* -d | {sh,bash,zsh,dash,ksh,fish}"
      - "* -d | {python*,node,perl,ruby,php,deno,bun,pwsh}"
      - "eval *"
  - id: destructive
    reason: irreversible damage
    shell:
      - "rm -rf /"
      - "rm -fr /"
      - "rm -rf /[*]"
      - "rm -rf --no-preserve-root*"
      - "rm -rf ~"
      - "rm -fr ~"
      - "rm -rf ~/[*]"
      - "rm -rf $HOME"
      - "git push --force*"
      - "git push -f*"
      # a `+` refspec, and force flags after the remote or bundled with other short options
      - "git push * +*"
      - "git push * --force*"
      - "git push * -f*"
      - "git push * -[!o-]*f*"
      # deleting a remote branch: an empty source refspec (`:main`), `--delete`, `-d`
      - "git push * :?*"
      - "git push * --delete*"
      - "git push * -d*"
      - "git push * -[!o-]*d*"
      - "git reset --hard*"
      - "git clean -fdx*"
      - "git branch -D *"
      - "git stash drop*"
      - "git stash clear*"
      - "sudo *"
      - "mkfs*"
      - "dd if=*"
      - "shutdown *"
      - "reboot"
  - id: kernel-self
    reason: agentmoat protects its own policy, hooks and binary
    fs.write:
      # the state and host directories themselves: renaming, deleting or replacing
      # one with a link removes every pinned file and hook inside it at once
      - "~/.moat"
      - "~/.claude"
      - "~/.codex"
      - "~/.cursor"
      - "**/.moat"
      - "**/.claude"
      - "**/.codex"
      - "**/.cursor"
      - "~/.moat/**"
      - "~/.claude/settings.json"
      - "~/.claude/settings.local.json"
      - "~/.codex/**"
      - "~/.cursor/hooks.json"
      - "**/.claude/settings.json"
      - "**/.claude/settings.local.json"
      - "**/.cursor/hooks.json"
      - "**/.codex/hooks.json"
      - "**/.moat/**"
      # the binary every installed hook runs
      - "**/bin/moat"
      - "**/bin/moat.exe"
    shell:
      - "moat policy *"
      - "moat init*"
      - "moat doctor*"
      - "moat allow*"
      - "*/moat policy *"
      - "*/moat init*"
      - "*/moat doctor*"
      - "*/moat allow*"
      # pseudo-terminal wrappers that fake the terminal `allow`/`doctor --accept` require
      - "script * moat {allow,doctor,init,policy}*"
      - "script * */moat {allow,doctor,init,policy}*"
      - "script * '*moat {allow,doctor,init,policy}*'"
      - "expect * '*moat {allow,doctor,init,policy}*'"
      - "unbuffer * moat {allow,doctor,init,policy}*"
      - "unbuffer * */moat {allow,doctor,init,policy}*"
      - "*/script * moat {allow,doctor,init,policy}*"
      - "*/script * */moat {allow,doctor,init,policy}*"
      - "*/script * '*moat {allow,doctor,init,policy}*'"
      - "*/expect * '*moat {allow,doctor,init,policy}*'"
      # Python's pty module, terminal multiplexers and macOS Terminal scripting (ADR-014)
      - "{python*,*/python*} * '*pty*spawn*(*moat*{allow,doctor,init,policy}*'"
      - "{tmux,*/tmux,screen,*/screen} * moat {allow,doctor,init,policy}*"
      - "{tmux,*/tmux,screen,*/screen} * */moat {allow,doctor,init,policy}*"
      - "{tmux,*/tmux,screen,*/screen} * '*moat {allow,doctor,init,policy}*'"
      - "{osascript,*/osascript} * '*moat {allow,doctor,init,policy}*'"
  - id: shell-rc
    reason: edits persist into every future shell session
    fs.write: ["~/.zshrc", "~/.bashrc", "~/.bash_profile", "~/.profile", "~/.zprofile", "~/.zshenv"]

allow:
  - id: project-fs
    # the root itself too: a search with no path reads the whole project
    fs.read: ["${project}", "${project}/**"]
    fs.write: ["${project}/**", "!${project}/.git/**", "!${project}/.moat/**"]
  - id: dev-shell
    shell:
      - "git status*"
      - "git diff*"
      - "git log*"
      - "git show*"
      - "git branch*"
      - "git add *"
      - "git commit *"
      - "git checkout -b *"
      - "git switch *"
      - "git fetch*"
      - "git pull*"
      - "git stash*"
      - "ls*"
      - "cat *"
      - "head *"
      - "tail *"
      - "grep *"
      - "rg *"
      - "find *"
      - "pwd"
      - "echo *"
      - "which *"
      - "npm test*"
      - "npm run *"
      - "pnpm test*"
      - "pnpm run *"
      - "pnpm build*"
      - "pnpm lint*"
      - "pnpm typecheck*"
      - "pnpm exec *"
      - "yarn exec *"
      - "npm exec *"
      - "yarn test*"
      - "yarn run *"
      - "yarn build*"
      - "yarn lint*"
      - "cargo build*"
      - "cargo test*"
      - "cargo check*"
      - "cargo clippy*"
      - "cargo fmt*"
      - "cargo run*"
      - "cargo doc*"
      - "cargo bench*"
      - "cargo nextest*"
      - "cargo tree*"
      - "cargo metadata*"
      - "go test*"
      - "go build*"
      - "go vet*"
      - "swift test*"
      - "swift build*"
      - "pytest*"
      - "python -m pytest*"
      - "make test*"
      - "make build*"
      - "make check*"
      - "make lint*"
      # options that run another program or write outside the command's own output (ADR-012)
      - "!find * -exec*"
      - "!find * -ok*"
      - "!find * -delete*"
      - "!find * -fprint*"
      - "!find * -fls*"
      - "!rg * --pre"
      - "!rg * --pre=*"
      - "!git * --upload-pack*"
      - "!git * --receive-pack*"
      - "!go * -exec*"
      - "!go * -toolexec*"
      - "!go * -vettool*"
      - "!cargo * --config*"
  - id: dev-readonly
    reason: read-only inspection tools and non-secret variables
    shell:
      - "wc *"
      - "diff *"
      - "tree*"
      - "docker ps*"
      - "docker images*"
      - "docker logs *"
      - "docker version*"
      - "gh pr view*"
      - "gh pr list*"
      - "gh pr diff*"
      - "gh pr checks*"
      - "gh issue view*"
      - "gh issue list*"
      - "gh run list*"
      - "gh run view*"
      - "gh repo view*"
      - "!* --output*"
      - "!* -o *"
    env.read: ["PATH", "HOME", "USER", "SHELL", "PWD", "LANG", "TERM", "TMPDIR", "EDITOR"]
  - id: dev-tools
    shell:
      - "tsc*"
      - "eslint *"
      - "prettier *"
      - "biome *"
      - "vitest*"
      - "jest*"
      - "mocha*"
      - "ruff *"
      - "black *"
      - "mypy *"
      - "golangci-lint*"
  - id: registries
    net:
      - "api.github.com"
      - "github.com"
      - "registry.npmjs.org"
      - "crates.io"
      - "static.crates.io"
      - "index.crates.io"
      - "proxy.golang.org"
      - "pypi.org"
      - "files.pythonhosted.org"
  - id: safe-mcp
    mcp: ["mcp__github__search_*", "mcp__github__get_*", "mcp__filesystem__read_*", "mcp__filesystem__list_*"]

ask:
  - id: installs
    reason: new dependency
    shell: ["npm install *", "npm i *", "npm ci*", "pnpm add *", "pnpm install*", "pnpm dlx *", "yarn add *", "yarn install*", "yarn dlx *", "npx *", "pip install *", "pip3 install *", "cargo add *", "cargo install *", "brew install *", "gem install *"]
  - id: push
    reason: publishes to a remote
    shell: ["git push *", "npm publish*", "pnpm publish*", "yarn publish*", "cargo publish*", "gh release *"]
  - id: local-net
    reason: local service; may expose a control API (Docker, databases, cloud agents)
    net: ["localhost", "127.0.0.1", "::1"]

executables: {}
