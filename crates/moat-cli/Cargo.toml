[package]
name = "moat-kernel"
description = "Policy guard for AI coding agents: decides allow, ask or deny for every tool call from Claude Code, Codex and Cursor, and keeps a local audit log. Decides only; it is not an OS sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "moat"
path = "src/main.rs"

[dependencies]
moat-core.workspace = true
moat-hosts.workspace = true
moat-audit.workspace = true
moat-proxy.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true

[dev-dependencies]
moat-audit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

# Release archives carry the repository README (install, status) rather than this
# crate's command reference.
[package.metadata.dist]
auto-includes = false
include = ["../../README.md", "../../CHANGELOG.md", "../../LICENSE-MIT", "../../LICENSE-APACHE"]
