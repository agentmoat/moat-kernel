[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# moat-core must stay free of I/O and runtime crates (REPO_STRUCTURE.md §3).
deny = [
    { crate = "tokio", wrappers = ["moat-kernel"] },
    { crate = "rusqlite", wrappers = ["moat-audit"] },
    { crate = "reqwest", wrappers = ["moat-kernel"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
