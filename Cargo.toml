[workspace]
resolver = "2"
members = [
    "crates/moat-core",
    "crates/moat-hosts",
    "crates/moat-audit",
    "crates/moat-proxy",
    "crates/moat-cli",
]
# Fuzz targets build with nightly and `cargo fuzz`; they are their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentmoat/moat-kernel"
homepage = "https://github.com/agentmoat/moat-kernel"
authors = ["agentmoat contributors"]
keywords = ["ai-agents", "security", "policy", "mcp", "guardrails"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
moat-core = { path = "crates/moat-core", version = "0.1.0-alpha.0" }
moat-hosts = { path = "crates/moat-hosts", version = "0.1.0-alpha.0" }
moat-audit = { path = "crates/moat-audit", version = "0.1.0-alpha.0" }
moat-proxy = { path = "crates/moat-proxy", version = "0.1.0-alpha.0" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
globset = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
sha2 = "0.11"
tempfile = "3"
httparse = "1.10"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn" # nursery; threshold in clippy.toml
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Release archives (dist) build with the release profile.
[profile.dist]
inherits = "release"
