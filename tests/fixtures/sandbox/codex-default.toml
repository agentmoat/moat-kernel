[permissions.moat.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
".moat" = "read"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/.envrc" = "deny"
"**/.claude/settings.json" = "deny"
"**/.claude/settings.local.json" = "deny"
"**/.cursor/hooks.json" = "deny"
"**/.codex/hooks.json" = "deny"
"**/.moat/**" = "deny"
"**/bin/moat" = "deny"
"**/bin/moat.exe" = "deny"
"**/apps/moat/current" = "deny"
"**/apps/moat/*/moat.exe" = "deny"

[permissions.moat.network]
enabled = true
allow_upstream_proxy = true
allow_local_binding = false

[permissions.moat.network.domains]
"api.github.com" = "allow"
"github.com" = "allow"
"registry.npmjs.org" = "allow"
"crates.io" = "allow"
"static.crates.io" = "allow"
"index.crates.io" = "allow"
"proxy.golang.org" = "allow"
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"metadata.google.internal" = "deny"
"metadata.goog" = "deny"

[features]
network_proxy = true
# stricter: fs.read `secrets-paths`: Codex cannot re-allow inside a deny glob, so the exceptions (**/.env.example, **/.env.sample, **/.env.template) stay denied
# stricter: fs.write `codex.git`: Codex keeps all of `.git` read-only: sandboxed commands cannot commit, Codex asks to run them outside the sandbox
# wider: fs.read `codex.minimal`: Codex's minimal platform reads (system libraries, devices) every command needs
# wider: fs.read `sandbox.read_roots`: the hook decides these reads by the rules (ask by default); OS layers allow them so commands can run, and deny rules still win
# wider: fs.write `codex.tmpdir`: commands may write the temp directory; the hook asks
# wider: fs.write `codex.directory-nodes`: a denied directory covers its subtree, so these directory nodes are left out and only the files below them are denied; renaming or deleting the directory itself is left to the hook
# wider: net `codex.upstream`: Codex's own proxy decides the hosts; it sends what it allows on to `moat proxy` only when Codex starts with HTTP_PROXY and HTTPS_PROXY set to http://127.0.0.1:18080, which config.toml cannot set. Without them that traffic skips OpenMoat's address checks, audit log and brokered secrets
