  action: { shell: "npm exec -- sh -c 'echo $GITHUB_TOKEN'" }
  expect: { verdict: deny, rules: [env-secrets] }
- id: T7-npx-call-reads-key
  threat: T7
  action: { shell: "npx -c 'cat ~/.ssh/id_rsa'" }
  expect: { verdict: deny, rules: [secrets-paths] }
- id: T4-git-branch-force-delete
  threat: T4
