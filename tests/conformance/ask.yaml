# Actions that must pause for human approval.
# Evaluation context: home=/Users/me, project=/p, cwd=/p.

- id: ask-npm-install
  action: { shell: "npm install left-pad-pro" }
  expect: { verdict: ask, rules: [installs] }
- id: ask-pip-install
  action: { shell: "pip install requests==2.32.0" }
  expect: { verdict: ask, rules: [installs] }
- id: ask-git-push
  action: { shell: "git push origin HEAD" }
  expect: { verdict: ask, rules: [push] }
- id: ask-npm-publish
  action: { shell: "npm publish --access public" }
  expect: { verdict: ask, rules: [push] }
- id: ask-unknown-command
  action: { shell: "terraform apply -auto-approve" }
  expect: { verdict: ask, rules: [default] }
- id: ask-write-git-internals
  action: { fs_write: "/p/.git/config" }
  expect: { verdict: ask, rules: [default] }
- id: ask-write-outside-project
  action: { fs_write: "/tmp/output.txt" }
  expect: { verdict: ask, rules: [default] }

# Unparseable input is never allowed.
- id: ask-unbalanced-quote
  action: { shell: "echo 'oops" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-unterminated-substitution
  action: { shell: "echo $(whoami" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-unterminated-heredoc
  action: { shell: "cat <<EOF\nno terminator" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-nesting-too-deep
  action: { shell: "bash -c \"eval eval eval eval eval eval true\"" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-empty-command
  action: { shell: "   " }
  expect: { verdict: ask, rules: [unparseable] }

- id: ask-inline-python-prints-version
  action: { shell: "python3 -c 'import sys; print(sys.version)'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-inline-node-prints-version
  action: { shell: "node -e 'console.log(process.version)'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-pnpm-exec-unlisted-tool
  action: { shell: "pnpm exec some-unlisted-tool --flag" }
  expect: { verdict: ask, rules: [default] }
- id: ask-cargo-add
  action: { shell: "cargo add serde" }
  expect: { verdict: ask, rules: [installs] }
- id: ask-cargo-publish
  action: { shell: "cargo publish" }
  expect: { verdict: ask, rules: [push] }
- id: ask-pnpm-install
  action: { shell: "pnpm install" }
  expect: { verdict: ask, rules: [installs] }
- id: ask-npx-downloads-a-tool
  action: { shell: "npx prettier --check ." }
  expect: { verdict: ask, rules: [installs] }
- id: ask-rm-rf-temp-dir-is-not-destructive
  action: { shell: "rm -rf /tmp/build" }
  expect: { verdict: ask, rules: [default] }
- id: ask-create-symlink-and-read-through-it
  action: { shell: "ln -s ~/.ssh ./s && cat ./s/id_rsa" }
  expect: { verdict: ask, rules: [default] }
# T3: env with arguments sets variables for one command; it is not a dump
- id: ask-env-assignment-wrapper-is-not-a-dump
  action: { shell: "env FOO=1 git status" }
  expect: { verdict: ask, rules: [default] }
- id: ask-printenv-one-ordinary-variable
  action: { shell: "printenv HOME" }
  expect: { verdict: ask, rules: [default] }
- id: ask-set-shell-options-is-not-a-dump
  action: { shell: "set -euo pipefail" }
  expect: { verdict: ask, rules: [default] }
# T7: make arguments that replace the recipe shell or inject makefile text ask
- id: ask-make-shell-override-after-target
  action: { shell: "make test SHELL=/tmp/evil" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-shell-override-before-target
  action: { shell: "make SHELL=/tmp/evil test" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-shellflags-override
  action: { shell: "make test .SHELLFLAGS=-ec" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-environment-overrides
  action: { shell: "make test -e" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-eval-harmless-text
  action: { shell: "make test -E 'x:;id'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-file-outside-project
  action: { shell: "make test --file=/tmp/evil.mk" }
  expect: { verdict: ask, rules: [default] }
# T7: decoding without an interpreter on the receiving end is not pipe-to-shell
- id: ask-base64-decode-to-file
  action: { shell: "base64 -d file > out" }
  expect: { verdict: ask, rules: [default] }
- id: ask-gunzip-into-tar
  action: { shell: "gunzip -c x.gz | tar x" }
  expect: { verdict: ask, rules: [default] }
- id: ask-decoded-stdin-to-shell-running-a-script
  action: { shell: "base64 -d f | bash build.sh" }
  expect: { verdict: ask, rules: [default] }
# T9: recording an ordinary command with script is not kernel-self
- id: ask-script-recording-ordinary-command
  action: { shell: "script -q build.log make test" }
  expect: { verdict: ask, rules: [default] }
# T7: options that run another program or write files are excluded from dev-shell
- id: ask-find-exec-ordinary-command
  action: { shell: "find . -name '*.tmp' -exec rm {} \\;" }
  expect: { verdict: ask, rules: [default] }
- id: ask-find-delete
  action: { shell: "find . -delete" }
  expect: { verdict: ask, rules: [default] }
- id: ask-rg-preprocessor
  action: { shell: "rg --pre=sh TODO" }
  expect: { verdict: ask, rules: [default] }
- id: ask-git-fetch-upload-pack
  action: { shell: "git fetch --upload-pack='touch /tmp/pwn' origin" }
  expect: { verdict: ask, rules: [default] }
- id: ask-git-log-output-outside-project
  action: { shell: "git log --output=/tmp/log.txt" }
  expect: { verdict: ask, rules: [default] }
- id: ask-go-test-exec-wrapper
  action: { shell: "go test -exec /tmp/x ./..." }
  expect: { verdict: ask, rules: [default] }
- id: ask-cargo-config-override
  action: { shell: "cargo test --config 'build.rustc-wrapper=\"/tmp/x\"'" }
  expect: { verdict: ask, rules: [default] }
# Inspection that can run code, write, or mutate stays outside dev-readonly
- id: ask-sed-script-can-execute
  action: { shell: "sed -n '1e id' src/main.rs" }
  expect: { verdict: ask, rules: [default] }
- id: ask-gh-api-can-write
  action: { shell: "gh api repos/x/y -X DELETE" }
  expect: { verdict: ask, rules: [default] }
- id: ask-docker-run
  action: { shell: "docker run --rm alpine" }
  expect: { verdict: ask, rules: [default] }
- id: ask-gh-run-view-writes-output-file
  action: { shell: "gh run view 3 --log -o out.txt" }
  expect: { verdict: ask, rules: [default] }
